<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .video-card {
            width: 100%;
            max-width: 420px;
            background-color: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #27272a;
            padding: 16px;
        }

        /* --- HEADER --- */
        .card-header {
            margin-bottom: 12px;
            text-align: center;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* --- VIDEO PLAYER --- */
        .video-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            min-height: 220px;
        }

        .video-js {
            width: 100% !important;
            height: 230px !important;
            border-radius: 10px;
        }

        .action-area {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- TOMBOL MONETAG / SPONSOR --- */
        .btn-sponsor {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-sponsor:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
        }

        .sub-text {
            font-size: 11px;
            color: #a1a1aa;
            text-align: center;
            line-height: 1.4;
        }

        .btn-shopee {
            display: block;
            background-color: #27272a;
            color: #e4e4e7;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            border: 1px solid #3f3f46;
            transition: background-color 0.2s;
        }

        .btn-shopee:hover {
            background-color: #3f3f46;
        }

        .ad-container {
            width: 100%;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="video-card">
    <div class="card-header">

    <div class="action-area">

           rel="noopener noreferrer" 
           class="btn-shopee">

<!-- SDK JavaScript Pemutar Video & Iklan VAST -->
<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-ads/6.6.5/videojs-contrib-ads.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.11.0/videojs.ima.min.js"></script>

<script>
    // 1. Inisialisasi Player Video.js
    var player = videojs('myVideo');

    // 2. Pengaturan In-Stream Video VAST ExoClick
    var options = {
        id: 'myVideo',
        adTagUrl: 'https://s.magsrv.com/v1/vast.php?idz=5995492'
    };

    // 3. Mengaktifkan Plugin IMA Ads pada Video Player
    player.ima(options);

    // 4. Penanganan Kompatibilitas Pemutaran Iklan Seluler (Android / iOS)
    var contentPlayer = document.getElementById('myVideo_html5_api');
    if (navigator.userAgent.match(/iPhone|iPad|iPod|Android/i)) {
        player.one('touchend', function() {
            player.ima.initializeAdDisplayContainer();
        });
    }
</script>
